<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Love in ∞ languages</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#000;
    overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    touch-action:none;
  }
  h1{
    margin-top:6vh;
    color:#fff;
    font-size:clamp(20px, 6vw, 38px);
    font-weight:900;
    text-align:center;
    z-index:10;
    letter-spacing:0.5px;
  }
  h1 .cyan{color:#2ee6ff; text-shadow:0 0 12px #2ee6ff}
  h1 .inf{
    font-size:1.4em;
    background:linear-gradient(90deg,#ff5af7,#4a8cff,#2ee6ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 8px #ff5af7);
  }
  #stage{
    position:relative;
    width:100vw;
    height:70vh;
    margin-top:2vh;
  }
  .word{
    position:absolute;
    white-space:nowrap;
    font-weight:700;
    opacity:0;
    will-change:transform,opacity;
    transition:transform 1.8s cubic-bezier(.16,1,.3,1), opacity .8s;
    line-height:1;
  }
  /* PLAY BUTONU - TELEFON İÇİN */
  #musicControl{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.2);
    color:#fff;
    padding:14px 28px;
    border-radius:50px;
    font-size:15px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    box-shadow:0 8px 32px rgba(0,0,0,0.6);
  }
  #musicControl:active{transform:translateX(-50%) scale(0.95)}
  #musicControl .icon{font-size:18px}
  #musicControl.playing{
    background:linear-gradient(90deg,#ff5af7,#4a8cff);
    border-color:transparent;
  }
  /* dalga animasyonu */
  .playing #wave span{
    display:inline-block;
    width:3px;
    height:12px;
    background:#fff;
    margin:0 1px;
    border-radius:3px;
    animation:wave 0.8s infinite ease-in-out;
  }
  .playing #wave span:nth-child(2){animation-delay:0.1s}
  .playing #wave span:nth-child(3){animation-delay:0.2s}
  @keyframes wave{
    0%,100%{height:5px}
    50%{height:14px}
  }
</style>
</head>
<body>
  <h1><span class="cyan">Love, in</span> <span class="inf">∞</span> <span class="cyan">languages</span></h1>
  <div id="stage"></div>

  <button id="musicControl">
    <span class="icon" id="btnIcon">▶️</span>
    <span id="btnText">Müziği Başlat</span>
    <span id="wave" style="display:none"><span></span><span></span><span></span></span>
  </button>

  <!-- ŞARKI BURADA -->
  <!-- 1. Kendi şarkını kullanmak için sarki.mp3 dosyasını yanına at -->
  <!-- 2. Şimdilik online demo şarkı çalıyor -->
  <audio id="bgMusic" loop preload="auto" crossorigin="anonymous">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a650f6.mp3?filename=romantic-love-piano-112199.mp3" type="audio/mpeg">
  </audio>

<script>
const loves=["Amor","Love","Aşk","Amour","Liebe","Amore","Milosć","Laska","Dragoste","Kärlek","Kjærlighed","Rakkaus","Szerelem","Ljubav","Meilė","Mīlestība","Gra","Cariad","Habibi","Ishq","Pyaar","Prem","Kaadhal","Mohabbat","Eshgh","Sevgi","Suyuu","Hou","Aloha","Aroha","Upendo","Ifẹ","Lerato","Thando","Rudo","Sarang","Ai","Ahava","Cinta","Sayang","Mahal","Obich","Kocham","Volim","Te iubesc","Milujem","Szeretlek","Miluji","Elsker","Amar","Amo","Liefde","Prem","Jaan","Dil","Qalb","Hob","Lyubov","Aishiteru","Saranghae","Mahal kita","Je t'aime","Ti amo","Ich liebe dich","Te amo","Ya Amar"];

const stage=document.getElementById('stage');
const colors=["#ff5af7","#4a8cff","#2ee6ff","#7cffb2","#ffd93d","#ff8a5a","#c084fc","#5ee9ff","#ff6b9d","#45f0df"];

function lemniscate(t,scale){
  const s=Math.sin(t), c=Math.cos(t);
  const d=1+s*s;
  return {x:scale*c/d, y:scale*s*c/d};
}

const isMobile = window.innerWidth < 600;
const centerX = window.innerWidth/2;
const centerY = window.innerHeight * (isMobile ? 0.38 : 0.4);
const scale = Math.min(window.innerWidth*0.85, 650) * (isMobile ? 0.38 : 0.45);

const total = isMobile ? 90 : 140;
const points=[];
for(let i=0;i<total;i++){
  const t=(i/total)*Math.PI*2;
  const p=lemniscate(t,scale);
  p.x+=(Math.random()-0.5)*(isMobile?15:25);
  p.y+=(Math.random()-0.5)*(isMobile?20:35);
  points.push(p);
}

points.forEach((pt,i)=>{
  const el=document.createElement('span');
  el.className='word';
  el.textContent=loves[i%loves.length];
  el.style.color=colors[Math.floor(Math.random()*colors.length)];
  el.style.fontSize=(isMobile?7+Math.random()*9:9+Math.random()*13)+'px';
  el.style.left=centerX+'px';
  el.style.top=centerY+'px';
  
  const startX=(Math.random()-0.5)*window.innerWidth*1.5;
  const startY=Math.random()<0.5?-200:window.innerHeight+200;
  el.style.transform=`translate(${startX}px, ${startY}px) rotate(${(Math.random()-0.5)*120}deg) scale(0)`;
  stage.appendChild(el);
  
  setTimeout(()=>{
    el.style.opacity='1';
    el.style.transform=`translate(${pt.x}px, ${pt.y}px) rotate(${(Math.random()-0.5)*25}deg) scale(1)`;
  }, i*30 + Math.random()*500);
});

// MÜZİK KONTROL
const music=document.getElementById('bgMusic');
const btn=document.getElementById('musicControl');
const btnIcon=document.getElementById('btnIcon');
const btnText=document.getElementById('btnText');
const wave=document.getElementById('wave');
let isPlaying=false;

async function toggleMusic(){
  try{
    if(!isPlaying){
      music.volume=0;
      await music.play();
      // fade in
      let v=0;
      const fade=setInterval(()=>{v+=0.05; music.volume=Math.min(v,0.55); if(v>=0.55) clearInterval(fade)},60);
      btn.classList.add('playing');
      btnIcon.textContent='⏸️';
      btnText.textContent='Durdur';
      wave.style.display='inline-flex';
      isPlaying=true;
    }else{
      // fade out
      let v=music.volume;
      const fade=setInterval(()=>{v-=0.08; music.volume=Math.max(v,0); if(v<=0){clearInterval(fade); music.pause();}},60);
      btn.classList.remove('playing');
      btnIcon.textContent='▶️';
      btnText.textContent='Müziği Başlat';
      wave.style.display='none';
      isPlaying=false;
    }
  }catch(e){
    alert('Müziği başlatmak için ekrana bir kez daha dokun kanka');
  }
}

btn.addEventListener('click', toggleMusic);
// ilk dokunuşta otomatik başlat (telefon için)
document.body.addEventListener('touchstart', ()=>{
  if(!isPlaying){
    // sadece ilk sefer otomatik başlatma denemesi
    toggleMusic();
  }
}, {once:true});

</script>
</body>
</html>
